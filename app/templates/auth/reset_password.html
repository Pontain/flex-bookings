{% extends "public_base.html" %}

{% block title %}Återställ lösenord{% endblock %}

{% block content %}
<div class="login-card">
    <h1>Välj nytt lösenord</h1>

    <form method="post" action="/reset-password/{{ token }}" class="form-dark">
<input type="hidden" name="csrf_token" value="{{ request.session.csrf }}">
        <div class="form-group">
            <label for="password">Nytt lösenord</label>
            <input type="password" minlength="12" maxlength="128" id="password" name="password" required minlength="8">
        </div>

        <button type="submit" class="btn btn-primary">
            Spara nytt lösenord
        </button>
    </form>
</div>
{% endblock %}
