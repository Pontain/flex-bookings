{% extends "public_base.html" %}

{% block title %}Modium | Skapa konto{% endblock %}

{% block content %}
<div class="users-page">
    <div class="page-toolbar">
        <div class="page-toolbar-left">
            <h1 class="page-title">Skapa konto</h1>
            <p class="page-description">Skapa ett konto och en organisation i systemet.</p>
        </div>
    </div>

    <div class="content-card">
        <form method="post" action="/register" class="form-dark">
            {% if error %}
                <div class="form-error">{{ error }}</div>
            {% endif %}

            <div class="form-group">
                <label for="organization_name">Organisation</label>
                <input
                    type="text"
                    id="organization_name"
                    name="organization_name"
                    value="{{ organization_name or '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="full_name">Namn</label>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    value="{{ full_name or '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">E-post</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email or '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Lösenord</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Skapa konto</button>
                <a href="/login" class="btn btn-secondary">Avbryt</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
