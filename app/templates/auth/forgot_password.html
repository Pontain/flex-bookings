{% extends "public_base.html" %}

{% block title %}Glömt lösenord{% endblock %}

{% block content %}
<div class="login-card">
    <h1>Glömt lösenord</h1>
    <p>Skriv in din e-postadress så skickar vi en länk för att återställa lösenordet.</p>

    <form method="post" action="/forgot-password" class="form-dark">
<input type="hidden" name="csrf_token" value="{{ request.session.csrf }}">
        <div class="form-group">
            <label for="email">E-post</label>
            <input type="email" id="email" name="email" required>
        </div>

        <button type="submit" class="btn btn-primary">
            Skicka återställningslänk
        </button>
    </form>

    <a href="/login" class="forgot-password-link">Tillbaka till login</a>
</div>
{% endblock %}
