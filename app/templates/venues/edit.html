{% extends "base.html" %}

{% block title %}Modium | Redigera lokal{% endblock %}

{% block content %}
<div class="venues-page">
    <div class="page-toolbar">
        <div class="page-toolbar-left">
            <h1 class="page-title">Redigera lokal</h1>
            <p class="page-description">Uppdatera information om lokalen.</p>
        </div>
    </div>

    <div class="content-card">
        <form method="post" action="/venues/{{ venue.id }}/edit" class="form-dark">
<input type="hidden" name="csrf_token" value="{{ request.session.csrf }}">
            <div class="form-group">
                <label for="name">Namn</label>
                <input type="text" id="name" name="name" value="{{ venue.name }}" required>
            </div>

            <div class="form-group">
                <label for="description">Beskrivning</label>
                <textarea id="description" name="description">{{ venue.description or "" }}</textarea>
            </div>

            <div class="form-group">
                <label for="capacity">Kapacitet</label>
                <input type="number" id="capacity" name="capacity" value="{{ venue.capacity }}" min="1" required>
            </div>

            <div class="form-group">
                <label for="color">Färg</label>
                <input
                    type="color"
                    id="color"
                    name="color"
                    value="{{ venue.color or '#5f73ff' }}"
                    class="color-input"
                >
            </div>

            <div class="form-group checkbox-group">
                <label for="is_active" class="checkbox-label">
                    <input
                        type="checkbox"
                        id="is_active"
                        name="is_active"
                        {% if venue.is_active %}checked{% endif %}
                    >
                    Aktiv
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Spara</button>
                <a href="/venues" class="btn btn-secondary">Avbryt</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
