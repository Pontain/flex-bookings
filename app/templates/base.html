<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Bokningssystem{% endblock %}</title>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="/static/css/base.css">

    <!-- SID-SPECIFIK CSS -->
    {% block extra_css %}{% endblock %}
</head>
<body>

    <header class="main-header">
        <nav class="main-nav">
            <a href="/dashboard">Dashboard</a>
            <a href="/calendar/week">Kalender</a>
            <a href="/bookings/new">Ny bokning</a>
        </nav>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- GLOBAL JS (om du vill ha senare) -->
    {% block extra_js %}{% endblock %}

</body>
</html>
