{% extends "base.html" %}

{% block title %}FlexBooking | Kalender{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/calendar.css">
{% endblock %}

{% block content %}
<div class="calendar-page">
    <div class="page-toolbar">
        <div class="page-toolbar-left">
            <h1 class="page-title">Kalender</h1>
            <p class="page-description">Veckoöversikt över bokningar</p>
        </div>

        <div class="page-toolbar-right">
            <button id="prev-week" class="btn btn-secondary">Föregående vecka</button>
            <button id="next-week" class="btn btn-secondary">Nästa vecka</button>
        </div>
    </div>

    <div class="content-card calendar-shell">
        <div class="calendar-header-row">
            <h2 id="week-label" class="calendar-week-label"></h2>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/calendar.js"></script>
{% endblock %}
