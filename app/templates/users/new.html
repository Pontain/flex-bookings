{% extends "base.html" %}

{% block title %}FlexBooking | Ny användare{% endblock %}

{% block content %}
<div class="users-page">
    <div class="page-toolbar">
        <div class="page-toolbar-left">
            <h1 class="page-title">Ny användare</h1>
            <p class="page-description">Skapa en ny användare i systemet.</p>
        </div>
    </div>

    <div class="content-card">
        <form method="post" action="/users/new" class="form-light booking-form glass">
            <div class="form-group">
                <label for="full_name">Namn</label>
                <input type="text" id="full_name" name="full_name" required>
            </div>

            <div class="form-group">
                <label for="email">E-post</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Lösenord</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group checkbox-group">
                <label for="is_superuser" class="checkbox-label">
                    <input type="checkbox" id="is_superuser" name="is_superuser">
                    Admin
                </label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Skapa</button>
                <a href="/users" class="btn btn-secondary">Avbryt</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
