{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/dashboard.css">
{% endblock %}

{% block content %}
<div class="dashboard-page">

    <header class="dashboard-header">
        <div>
            <h1>Dashboard</h1>
            <p>Översikt över bokningar och lokaler</p>
        </div>

        <div class="dashboard-nav">
            <a href="/calendar/week" class="nav-button">Öppna kalender</a>
            <a href="/bookings/new" class="nav-button primary">Ny bokning</a>
        </div>
    </header>

    <!-- resten som tidigare -->
    <div id="dashboard-calendar" class="dashboard-calendar"></div>

</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/dashboard.js"></script>
{% endblock %}
